server {
 listen 443 ssl;
 server_name tidings.example.org;
 ssl_certificate /etc/letsencrypt/live/tidings.example.org/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/tidings.example.org/privkey.pem;
 client_max_body_size 17m;
 location / {
  proxy_pass http://127.0.0.1:8085;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
}
