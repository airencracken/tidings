<VirtualHost *:443>
 ServerName tidings.example.org
 SSLEngine on
 SSLCertificateFile /etc/letsencrypt/live/tidings.example.org/fullchain.pem
 SSLCertificateKeyFile /etc/letsencrypt/live/tidings.example.org/privkey.pem
 ProxyPreserveHost On
 RequestHeader set X-Forwarded-Proto "https"
 ProxyPass / http://127.0.0.1:8085/
 ProxyPassReverse / http://127.0.0.1:8085/
 LimitRequestBody 17825792
</VirtualHost>
