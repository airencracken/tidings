services:
  tidings:
    image: ghcr.io/airencracken/tidings:v0.3.0
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      TIDINGS_BASE_URL: ${TIDINGS_BASE_URL:-https://tidings.example.org}
    volumes:
      - tidings-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  tidings-data:
