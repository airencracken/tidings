name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc {0}
env:
  GOWORK: "off"
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.x"
      - run: make check
      - run: make fuzz-smoke
      - run: npm --prefix scripts/browser ci
      - run: npm --prefix scripts/browser exec -- playwright install --with-deps chromium
      - run: make test-browser
